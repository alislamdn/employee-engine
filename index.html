<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173b34">
  <title>People Index | Employee search</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --ink: #202a26;
      --muted: #727b74;
      --canvas: #f6f7f4;
      --paper: #fff;
      --line: #e6e9e3;
      --pine: #173b34;
      --pine-soft: #e6eee9;
      --coral: #d86649;
      --gold: #eabf70;
      --sky: #e7eff3;
      --shadow: 0 18px 50px rgb(35 49 41 / 10%);
      font-family: "DM Sans", "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; min-height: 100vh; color: var(--ink); background: var(--canvas); }
    button, input, select, textarea { font: inherit; }
    button { color: inherit; }
    .app { min-height: 100vh; }
    .sidebar { position: fixed; inset: 0 auto 0 0; z-index: 5; display: flex; width: 248px; flex-direction: column; padding: 27px 17px 18px; color: #f2f5ef; background: var(--pine); }
    .brand { display: flex; align-items: center; gap: 11px; padding: 0 10px 27px; color: inherit; font-size: 15px; font-weight: 700; letter-spacing: .01em; }
    .brand-mark { display: grid; width: 31px; height: 31px; place-items: center; border-radius: 10px; color: var(--pine); background: var(--gold); font-family: Georgia, serif; font-size: 20px; }
    .workspace-label, .nav-label { padding: 0 11px; color: #a8b9af; font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .company-picker { position: relative; margin: 9px 0 26px; }
    .company-button { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 9px; border: 1px solid rgb(255 255 255 / 15%); border-radius: 8px; padding: 10px; color: #fff; background: rgb(255 255 255 / 7%); cursor: pointer; text-align: left; }
    .company-name { overflow: hidden; font-size: 12px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .company-caret { color: #a8b9af; font-size: 12px; }
    .company-menu { position: absolute; z-index: 10; top: calc(100% + 7px); left: 0; display: none; width: 100%; overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: #fff; box-shadow: var(--shadow); }
    .company-menu.open { display: block; }
    .company-menu button { display: block; width: 100%; border: 0; padding: 11px 12px; background: #fff; cursor: pointer; text-align: left; }
    .company-menu button:hover { background: var(--canvas); }
    .company-menu strong { display: block; color: var(--ink); font-size: 12px; }
    .company-menu small { color: var(--muted); font-size: 10px; }
    .nav-label { margin: 0 0 8px; }
    .nav { display: grid; gap: 4px; }
    .nav-button { display: flex; width: 100%; align-items: center; gap: 12px; border: 0; border-radius: 7px; padding: 10px 11px; color: #d3ded7; background: transparent; cursor: pointer; text-align: left; font-size: 12px; }
    .nav-button:hover { color: #fff; background: rgb(255 255 255 / 7%); }
    .nav-button.active { color: #fff; background: rgb(255 255 255 / 12%); }
    .nav-icon { width: 18px; color: #b4c7bb; font-size: 15px; text-align: center; }
    .nav-count { margin-left: auto; color: #a8b9af; font-size: 11px; }
    .sidebar-spacer { flex: 1; }
    .invite-rail { margin: 0 2px 16px; border: 1px solid rgb(255 255 255 / 13%); border-radius: 8px; padding: 14px 13px; background: rgb(255 255 255 / 5%); }
    .invite-rail strong { display: block; margin-bottom: 5px; font-size: 12px; }
    .invite-rail p { margin: 0 0 12px; color: #bdcbc2; font-size: 10px; line-height: 1.55; }
    .invite-rail button { border: 0; padding: 0; color: #f2c579; background: none; cursor: pointer; font-size: 11px; font-weight: 700; }
    .profile { display: flex; align-items: center; gap: 10px; border-top: 1px solid rgb(255 255 255 / 13%); padding: 16px 7px 0; }
    .profile .avatar { width: 31px; height: 31px; border: 1px solid rgb(255 255 255 / 30%); font-size: 10px; }
    .profile strong { display: block; font-size: 11px; }
    .profile small { color: #a8b9af; font-size: 10px; }
    .main { min-height: 100vh; margin-left: 248px; }
    .topbar { display: flex; height: 68px; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); padding: 0 42px; background: rgb(255 255 255 / 78%); }
    .breadcrumb { color: var(--muted); font-size: 11px; }
    .breadcrumb strong { color: var(--ink); font-weight: 600; }
    .top-actions { display: flex; align-items: center; gap: 9px; }
    .quiet-button, .primary-button, .icon-button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); border-radius: 6px; padding: 8px 11px; background: #fff; cursor: pointer; font-size: 11px; font-weight: 600; transition: transform .15s ease, border-color .15s ease, background .15s ease; }
    .quiet-button:hover, .icon-button:hover { border-color: #c6cec5; background: #f9faf7; }
    .primary-button { border-color: var(--pine); color: #fff; background: var(--pine); }
    .primary-button:hover { transform: translateY(-1px); background: #24564a; }
    .button-symbol { font-size: 15px; line-height: .8; }
    .content { width: min(1050px, 100%); margin: 0 auto; padding: 43px 42px 66px; }
    .hero { position: relative; overflow: hidden; border: 1px solid #e9e8df; border-radius: 10px; padding: 31px 34px 28px; background-color: #f0efe5; background-image: repeating-linear-gradient(135deg, rgb(255 255 255 / 26%) 0 1px, transparent 1px 9px); }
    .hero::after { position: absolute; top: -48px; right: 45px; width: 155px; height: 155px; border: 1px solid rgb(23 59 52 / 12%); border-radius: 50%; content: ""; box-shadow: 0 0 0 18px rgb(23 59 52 / 3%), 0 0 0 39px rgb(23 59 52 / 2%); pointer-events: none; }
    .eyebrow { margin: 0 0 12px; color: #65746b; font-size: 10px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
    h1, h2, h3, p { margin-top: 0; }
    .hero h1 { max-width: 600px; margin: 0 0 8px; font-family: "Newsreader", Georgia, serif; font-size: clamp(30px, 3vw, 39px); font-weight: 500; letter-spacing: 0; line-height: 1.07; }
    .hero-copy { margin: 0 0 23px; color: #68746a; font-size: 12px; }
    .search-wrap { position: relative; z-index: 1; display: flex; max-width: 680px; align-items: center; border: 1px solid #e3e4dc; border-radius: 7px; padding: 5px 6px 5px 14px; background: #fff; box-shadow: 0 4px 16px rgb(33 43 35 / 5%); }
    .search-symbol { margin-right: 11px; color: #738077; font-size: 19px; }
    .search-input { width: 100%; min-width: 0; border: 0; outline: 0; padding: 9px 0; color: var(--ink); background: transparent; font-size: 13px; }
    .search-input::placeholder { color: #9da49d; }
    .search-key { flex: 0 0 auto; border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; color: #8a938c; font-size: 9px; }
    .search-footnote { display: flex; gap: 17px; margin-top: 15px; color: #737d74; font-size: 10px; }
    .search-footnote span::before { margin-right: 6px; color: var(--coral); content: "•"; }
    .section-heading { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin: 34px 0 14px; }
    .section-heading h2 { margin: 0; font-family: "Newsreader", Georgia, serif; font-size: 23px; font-weight: 500; letter-spacing: 0; }
    .section-heading p { margin: 5px 0 0; color: var(--muted); font-size: 11px; }
    .text-button { border: 0; padding: 5px 0; color: var(--pine); background: transparent; cursor: pointer; font-size: 11px; font-weight: 700; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 11px; margin: 19px 0 31px; }
    .stat { display: flex; min-height: 68px; align-items: center; gap: 12px; border: 1px solid var(--line); border-radius: 7px; padding: 11px 14px; background: #fff; }
    .stat-icon { display: grid; width: 34px; height: 34px; flex: 0 0 auto; place-items: center; border-radius: 8px; color: var(--pine); background: var(--pine-soft); font-size: 15px; }
    .stat:nth-child(2) .stat-icon { color: #8c5734; background: #f7eddc; }
    .stat:nth-child(3) .stat-icon { color: #486679; background: var(--sky); }
    .stat strong { display: block; font-size: 17px; line-height: 1.1; }
    .stat small { color: var(--muted); font-size: 10px; }
    .people-toolbar { display: flex; align-items: center; gap: 8px; }
    .people-toolbar select, .filter-select { max-width: 160px; border: 1px solid var(--line); border-radius: 6px; padding: 8px 26px 8px 9px; color: #5d685f; background: #fff; font-size: 10px; }
    .people-list { overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
    .person-row { display: grid; min-height: 76px; grid-template-columns: minmax(160px, 1.35fr) minmax(130px, 1fr) minmax(120px, .85fr) auto; align-items: center; gap: 15px; border-bottom: 1px solid #eef0eb; padding: 12px 16px; }
    .person-row:last-child { border-bottom: 0; }
    .person-identity { display: flex; min-width: 0; align-items: center; gap: 11px; }
    .avatar { display: grid; width: 37px; height: 37px; flex: 0 0 auto; place-items: center; border-radius: 50%; color: #20463d; background: #dceae1; font-size: 11px; font-weight: 700; }
    .avatar.tone-1 { color: #754a36; background: #f2e2d2; }
    .avatar.tone-2 { color: #4d5f76; background: #dfe7ee; }
    .avatar.tone-3 { color: #6b4a6b; background: #eee3ef; }
    .avatar.tone-4 { color: #5b6539; background: #ebeedb; }
    .person-identity strong { display: block; overflow: hidden; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .person-identity small, .person-meta small { display: block; overflow: hidden; margin-top: 4px; color: var(--muted); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .person-meta { min-width: 0; }
    .person-meta strong { display: block; overflow: hidden; font-size: 10px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .person-actions { display: flex; align-items: center; gap: 4px; }
    .icon-button { width: 31px; height: 31px; border-color: transparent; padding: 0; color: #718077; background: transparent; font-size: 15px; }
    .icon-button.saved { color: var(--coral); }
    .empty-state { padding: 34px 20px; color: var(--muted); text-align: center; font-size: 12px; }
    .empty-state strong { display: block; margin-bottom: 7px; color: var(--ink); font-family: "Newsreader", Georgia, serif; font-size: 19px; font-weight: 500; }
    .shortcut-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .shortcut-card { min-height: 112px; border: 1px solid var(--line); border-radius: 8px; padding: 15px; background: #fff; cursor: pointer; text-align: left; transition: transform .16s ease, border-color .16s ease; }
    .shortcut-card:hover { transform: translateY(-2px); border-color: #b8c6bb; }
    .shortcut-card .shortcut-mark { display: grid; width: 28px; height: 28px; margin-bottom: 13px; place-items: center; border-radius: 7px; color: #875b38; background: #f6ebd8; font-size: 13px; }
    .shortcut-card strong { display: block; font-size: 11px; }
    .shortcut-card small { display: block; margin-top: 4px; color: var(--muted); font-size: 10px; }
    .meeting-list { display: grid; gap: 9px; }
    .meeting-row { display: flex; align-items: center; gap: 15px; border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; background: #fff; }
    .meeting-date { width: 44px; flex: 0 0 auto; color: var(--coral); text-align: center; }
    .meeting-date strong { display: block; font-family: "Newsreader", Georgia, serif; font-size: 22px; font-weight: 500; line-height: 1; }
    .meeting-date small { font-size: 9px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .meeting-info { min-width: 0; flex: 1; }
    .meeting-info strong { display: block; font-size: 11px; }
    .meeting-info small { display: block; margin-top: 4px; color: var(--muted); font-size: 10px; }
    .company-banner { display: flex; align-items: center; justify-content: space-between; gap: 20px; border: 1px solid var(--line); border-radius: 8px; padding: 23px; background: #fff; }
    .company-banner h2 { margin: 0 0 5px; font-family: "Newsreader", Georgia, serif; font-size: 24px; font-weight: 500; }
    .company-banner p { margin: 0; color: var(--muted); font-size: 11px; }
    .company-detail-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 13px; }
    .detail-panel { border: 1px solid var(--line); border-radius: 8px; padding: 17px; background: #fff; }
    .detail-panel h3 { margin: 0 0 12px; font-size: 11px; }
    .detail-panel p { margin: 0; color: var(--muted); font-size: 10px; line-height: 1.6; }
    .modal-backdrop { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; overflow-y: auto; padding: 18px; background: rgb(21 35 29 / 48%); animation: fade-in .16s ease-out; }
    .modal { width: min(440px, 100%); border: 1px solid rgb(255 255 255 / 80%); border-radius: 10px; padding: 24px; background: #fff; box-shadow: var(--shadow); animation: rise-in .2s ease-out; }
    .modal h2 { margin: 0 0 6px; font-family: "Newsreader", Georgia, serif; font-size: 25px; font-weight: 500; }
    .modal-copy { margin: 0 0 20px; color: var(--muted); font-size: 11px; line-height: 1.6; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .field { display: grid; gap: 6px; margin-bottom: 13px; }
    .field.full { grid-column: 1 / -1; }
    .field label { color: #515d54; font-size: 10px; font-weight: 700; }
    .field input, .field select, .field textarea { width: 100%; min-width: 0; border: 1px solid #dfe4dd; border-radius: 6px; padding: 10px; outline: none; color: var(--ink); background: #fff; font-size: 11px; }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: #76988a; box-shadow: 0 0 0 3px rgb(46 104 82 / 10%); }
    .field textarea { min-height: 75px; resize: vertical; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
    .notice { margin: 12px 0; border-radius: 6px; padding: 10px; color: #705b3b; background: #faf3e6; font-size: 10px; line-height: 1.6; }
    .link-box { overflow-wrap: anywhere; border: 1px solid var(--line); border-radius: 6px; padding: 11px; color: #52645a; background: var(--canvas); font-size: 10px; line-height: 1.5; }
    .toast { position: fixed; right: 24px; bottom: 23px; z-index: 40; max-width: min(360px, calc(100vw - 32px)); border-radius: 7px; padding: 12px 16px; color: #fff; background: #233f35; box-shadow: var(--shadow); font-size: 11px; animation: rise-in .2s ease-out; }
    .toast.error { background: #994d3a; }
    .mobile-brand { display: none; }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes rise-in { from { transform: translateY(7px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @media (max-width: 900px) {
      .sidebar { width: 215px; }
      .main { margin-left: 215px; }
      .topbar { padding: 0 24px; }
      .content { padding: 31px 24px 50px; }
      .person-row { grid-template-columns: minmax(140px, 1.3fr) minmax(110px, 1fr) auto; }
      .person-location { display: none; }
    }
    @media (max-width: 650px) {
      .sidebar { position: sticky; inset: 0 0 auto; width: 100%; height: auto; padding: 10px 12px 9px; }
      .brand { display: none; }
      .workspace-label, .nav-label, .sidebar-spacer, .invite-rail, .profile { display: none; }
      .mobile-brand { display: flex; align-items: center; gap: 8px; padding: 0 4px 9px; font-size: 12px; font-weight: 700; }
      .mobile-brand .brand-mark { width: 25px; height: 25px; border-radius: 7px; font-size: 16px; }
      .company-picker { position: absolute; top: 9px; right: 12px; display: block; width: min(46vw, 180px); margin: 0; }
      .company-button { padding: 7px 8px; }
      .nav { display: flex; overflow-x: auto; gap: 3px; }
      .nav-button { width: auto; flex: 0 0 auto; gap: 6px; padding: 8px 9px; font-size: 10px; }
      .nav-icon { width: auto; font-size: 13px; }
      .nav-count { font-size: 9px; }
      .main { margin-left: 0; }
      .topbar { height: 52px; padding: 0 15px; }
      .top-actions .quiet-button { padding: 7px 8px; font-size: 10px; }
      .top-actions .primary-button { padding: 7px 9px; font-size: 10px; }
      .breadcrumb { font-size: 10px; }
      .content { padding: 20px 14px 38px; }
      .hero { padding: 23px 19px 20px; }
      .hero::after { right: -73px; }
      .hero h1 { max-width: 360px; font-size: 32px; }
      .hero-copy { max-width: 260px; font-size: 11px; line-height: 1.55; }
      .search-key { display: none; }
      .search-footnote { flex-wrap: wrap; gap: 8px 13px; font-size: 9px; }
      .stats { gap: 7px; margin: 14px 0 25px; }
      .stat { min-height: 60px; gap: 7px; padding: 8px; }
      .stat-icon { width: 28px; height: 28px; font-size: 12px; }
      .stat strong { font-size: 15px; }
      .stat small { font-size: 9px; }
      .section-heading { align-items: start; margin-top: 27px; }
      .section-heading h2 { font-size: 21px; }
      .section-heading p { font-size: 10px; }
      .people-toolbar { gap: 5px; }
      .people-toolbar select, .filter-select { max-width: 112px; padding: 7px 18px 7px 6px; font-size: 9px; }
      .person-row { grid-template-columns: minmax(0, 1fr) auto; gap: 5px 9px; padding: 11px 12px; }
      .person-identity { grid-row: span 2; }
      .person-row > .person-role { grid-column: 1; margin-left: 48px; margin-top: -9px; }
      .person-row > .person-location { display: none; }
      .person-actions { grid-column: 2; grid-row: 1 / span 2; }
      .person-meta strong { font-size: 9px; }
      .person-meta small { font-size: 9px; }
      .shortcut-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .shortcut-card { min-height: 102px; padding: 11px; }
      .company-banner { align-items: flex-start; flex-direction: column; padding: 17px; }
      .company-detail-grid { grid-template-columns: 1fr; }
      .top-actions { gap: 5px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div id="app" class="app"></div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <script>
    const STORAGE_KEY = "people-index-v1";
    const seed = {
      companies: [{ id: "al-islam-md", name: "Al-Islam MD", industry: "Healthcare", location: "Maryland, US", inviteCode: "join-al-islam-md" }],
      people: [
        { id: "p-101", companyId: "al-islam-md", name: "Aisha Rahman", role: "People Operations Lead", department: "People & Culture", email: "aisha.rahman@alislammd.com", location: "Baltimore, MD", status: "Available" },
        { id: "p-102", companyId: "al-islam-md", name: "Omar Siddiqui", role: "Clinical Director", department: "Clinical", email: "omar.siddiqui@alislammd.com", location: "Silver Spring, MD", status: "In a meeting" },
        { id: "p-103", companyId: "al-islam-md", name: "Maya Johnson", role: "Product Designer", department: "Product & Design", email: "maya.johnson@alislammd.com", location: "Washington, DC", status: "Available" },
        { id: "p-104", companyId: "al-islam-md", name: "Bilal Khan", role: "IT Administrator", department: "Technology", email: "bilal.khan@alislammd.com", location: "Rockville, MD", status: "Available" },
        { id: "p-105", companyId: "al-islam-md", name: "Noor Haddad", role: "Recruiting Coordinator", department: "People & Culture", email: "noor.haddad@alislammd.com", location: "Baltimore, MD", status: "Away" },
        { id: "p-106", companyId: "al-islam-md", name: "Sam Chen", role: "Data Analyst", department: "Operations", email: "sam.chen@alislammd.com", location: "Remote, US", status: "Available" }
      ],
      meetings: [
        { id: "m-201", companyId: "al-islam-md", title: "People team weekly sync", personId: "p-101", date: "2026-10-16T10:30", duration: "30" },
        { id: "m-202", companyId: "al-islam-md", title: "Product & clinical check-in", personId: "p-103", date: "2026-10-17T14:00", duration: "45" }
      ],
      bookmarks: ["p-103"],
      shortcuts: [
        { id: "s-1", label: "People team", query: "People & Culture" },
        { id: "s-2", label: "Available now", query: "available" },
        { id: "s-3", label: "Working in Maryland", query: "Maryland" }
      ],
      activeCompany: "al-islam-md"
    };
    let data = loadData();
    let currentView = "search";
    let currentQuery = "";
    let activeDepartment = "all";
    let toastTimer;

    function loadData() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (saved && Array.isArray(saved.companies) && Array.isArray(saved.people)) return { ...structuredClone(seed), ...saved };
      } catch (error) {
        console.warn("Saved workspace could not be loaded.", error);
      }
      return structuredClone(seed);
    }
    function saveData() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
      catch (error) { showToast("Browser storage is unavailable. Changes may not persist.", true); }
    }
    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char]);
    }
    function activeCompany() { return data.companies.find(company => company.id === data.activeCompany) || data.companies[0]; }
    function companyPeople() { return data.people.filter(person => person.companyId === activeCompany().id); }
    function companyMeetings() { return data.meetings.filter(meeting => meeting.companyId === activeCompany().id); }
    function initials(name) { return name.split(/\s+/).slice(0, 2).map(part => part[0]).join("").toUpperCase(); }
    function tone(name) { return [...name].reduce((sum, char) => sum + char.charCodeAt(0), 0) % 5; }
    function showToast(message, isError = false) {
      const root = document.getElementById("toast-root");
      root.innerHTML = `<div class="toast${isError ? " error" : ""}" role="status">${escapeHtml(message)}</div>`;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { root.innerHTML = ""; }, 2800);
    }
    function setView(view) {
      currentView = view;
      currentQuery = "";
      activeDepartment = "all";
      render();
    }
    function render() {
      const company = activeCompany();
      const peopleCount = companyPeople().length;
      const meetingsCount = companyMeetings().length;
      const bookmarkedCount = companyPeople().filter(person => data.bookmarks.includes(person.id)).length;
      const navItems = [
        ["search", "⌕", "Find people", ""], ["shortcuts", "⌘", "Shortcuts", ""],
        ["saved", "♡", "Bookmarks", bookmarkedCount], ["meetings", "▦", "Meetings", meetingsCount], ["company", "⌂", "Company", ""]
      ];
      document.getElementById("app").innerHTML = `
        <aside class="sidebar">
          <div class="brand"><span class="brand-mark">p.</span><span>people index</span></div>
          <div class="mobile-brand"><span class="brand-mark">p.</span><span>people index</span></div>
          <div class="workspace-label">Your workspace</div>
          <div class="company-picker">
            <button class="company-button" id="company-picker" aria-expanded="false"><span class="company-name">${escapeHtml(company.name)}</span><span class="company-caret">⌄</span></button>
            <div class="company-menu" id="company-menu">${data.companies.map(item => `<button data-company="${escapeHtml(item.id)}"><strong>${escapeHtml(item.name)}</strong><small>${escapeHtml(item.industry || "Company")}</small></button>`).join("")}<button data-action="new-company"><strong>＋ Create a company</strong><small>Start another workspace</small></button></div>
          </div>
          <div class="nav-label">Directory</div>
          <nav class="nav" aria-label="Main navigation">${navItems.map(([view, icon, label, count]) => `<button class="nav-button${currentView === view ? " active" : ""}" data-view="${view}"><span class="nav-icon">${icon}</span><span>${label}</span>${count ? `<span class="nav-count">${count}</span>` : ""}</button>`).join("")}</nav>
          <div class="sidebar-spacer"></div>
          <div class="invite-rail"><strong>Grow your directory</strong><p>Invite your team with a company referral link.</p><button data-action="invite">Copy invite link →</button></div>
          <div class="profile"><span class="avatar tone-2">PI</span><span><strong>Workspace admin</strong><small>${peopleCount} people in directory</small></span></div>
        </aside>
        <main class="main">
          <header class="topbar"><div class="breadcrumb">${escapeHtml(company.name)} <span aria-hidden="true">/</span> <strong>${navItems.find(item => item[0] === currentView)?.[2] || "Find people"}</strong></div><div class="top-actions"><button class="quiet-button" data-action="invite"><span class="button-symbol">↗</span> Invite people</button><button class="primary-button" data-action="add-person"><span class="button-symbol">＋</span> Add person</button></div></header>
          <div class="content">${renderView(company, peopleCount, bookmarkedCount)}</div>
        </main>`;
      bindEvents();
      const joinCode = new URLSearchParams(location.search).get("join");
      if (joinCode && !sessionStorage.getItem(`joined-prompt-${joinCode}`)) {
        const invitedCompany = data.companies.find(item => item.inviteCode === joinCode);
        if (invitedCompany) { sessionStorage.setItem(`joined-prompt-${joinCode}`, "1"); openJoinModal(invitedCompany); }
      }
    }
    function renderView(company, peopleCount, bookmarkedCount) {
      if (currentView === "saved") return renderPeopleView("Bookmarks", "People you have saved for quick access.", companyPeople().filter(person => data.bookmarks.includes(person.id)));
      if (currentView === "shortcuts") return renderShortcuts();
      if (currentView === "meetings") return renderMeetings();
      if (currentView === "company") return renderCompany(company, peopleCount, bookmarkedCount);
      return renderSearch(company, peopleCount, bookmarkedCount);
    }
    function renderSearch(company, peopleCount, bookmarkedCount) {
      const departments = [...new Set(companyPeople().map(person => person.department).filter(Boolean))].sort();
      let matches = companyPeople().filter(person => {
        const haystack = `${person.name} ${person.role} ${person.department} ${person.email} ${person.location} ${person.status}`.toLowerCase();
        const queryMatches = currentQuery.toLowerCase().trim().split(/\s+/).filter(Boolean).every(part => haystack.includes(part));
        return queryMatches && (activeDepartment === "all" || person.department === activeDepartment);
      });
      const isSearching = currentQuery.trim() || activeDepartment !== "all";
      return `<section class="hero"><p class="eyebrow">${escapeHtml(company.name)} · People directory</p><h1>Good work starts<br>with the right person.</h1><p class="hero-copy">Search your whole team by name, role, skill, or location.</p><div class="search-wrap"><span class="search-symbol" aria-hidden="true">⌕</span><input class="search-input" id="directory-search" type="search" autocomplete="off" placeholder="Try “designer in DC” or “people team”" value="${escapeHtml(currentQuery)}" aria-label="Search people"><kbd class="search-key">Ctrl K</kbd></div><div class="search-footnote"><span>${peopleCount} teammates</span><span>${new Set(companyPeople().map(person => person.department).filter(Boolean)).size} departments</span><span>One connected directory</span></div></section>
        <div class="stats"><div class="stat"><span class="stat-icon">♧</span><span><strong>${peopleCount}</strong><small>People in team</small></span></div><div class="stat"><span class="stat-icon">▤</span><span><strong>${departments.length}</strong><small>Departments</small></span></div><div class="stat"><span class="stat-icon">♡</span><span><strong>${bookmarkedCount}</strong><small>Saved people</small></span></div></div>
        <section><div class="section-heading"><div><h2>${isSearching ? "Search results" : "Meet your people"}</h2><p>${isSearching ? `${matches.length} ${matches.length === 1 ? "person" : "people"} found` : "Your team, all in one place."}</p></div><div class="people-toolbar"><select id="department-filter" aria-label="Filter by department"><option value="all">All teams</option>${departments.map(department => `<option value="${escapeHtml(department)}"${activeDepartment === department ? " selected" : ""}>${escapeHtml(department)}</option>`).join("")}</select></div></div>${renderPeopleList(matches)}</section>
        <section><div class="section-heading"><div><h2>Quick access</h2><p>Pick up where you left off.</p></div><button class="text-button" data-view="shortcuts">All shortcuts →</button></div>${renderShortcutCards()}</section>`;
    }
    function renderPeopleView(title, subtitle, people) {
      return `<div class="section-heading"><div><p class="eyebrow">Your directory</p><h2>${escapeHtml(title)}</h2><p>${escapeHtml(subtitle)}</p></div>${title === "Bookmarks" ? "" : ""}</div>${renderPeopleList(people)}`;
    }
    function renderPeopleList(people) {
      if (!people.length) return `<div class="people-list"><div class="empty-state"><strong>No people found yet</strong>Try a different search, or add a teammate to this company.</div></div>`;
      return `<div class="people-list">${people.map(person => `<article class="person-row"><div class="person-identity"><span class="avatar tone-${tone(person.name)}">${escapeHtml(initials(person.name))}</span><span><strong>${escapeHtml(person.name)}</strong><small>${escapeHtml(person.email)}</small></span></div><div class="person-meta person-role"><strong>${escapeHtml(person.role)}</strong><small>${escapeHtml(person.department || "Team not set")}</small></div><div class="person-meta person-location"><strong>${escapeHtml(person.location || "Location not set")}</strong><small>${escapeHtml(person.status || "Available")}</small></div><div class="person-actions"><button class="icon-button${data.bookmarks.includes(person.id) ? " saved" : ""}" data-action="bookmark" data-person="${escapeHtml(person.id)}" title="${data.bookmarks.includes(person.id) ? "Remove bookmark" : "Bookmark person"}" aria-label="${data.bookmarks.includes(person.id) ? "Remove bookmark" : "Bookmark person"}">${data.bookmarks.includes(person.id) ? "♥" : "♡"}</button><a class="icon-button" href="mailto:${escapeHtml(person.email)}" title="Email ${escapeHtml(person.name)}" aria-label="Email ${escapeHtml(person.name)}" style="text-decoration:none">↗</a></div></article>`).join("")}</div>`;
    }
    function renderShortcutCards() {
      return `<div class="shortcut-grid">${data.shortcuts.slice(0, 3).map((shortcut, index) => `<button class="shortcut-card" data-shortcut="${escapeHtml(shortcut.id)}"><span class="shortcut-mark">${["◷", "✳", "⌖"][index % 3]}</span><strong>${escapeHtml(shortcut.label)}</strong><small>${escapeHtml(shortcut.query || "Open saved search")}</small></button>`).join("")}</div>`;
    }
    function renderShortcuts() {
      return `<div class="section-heading"><div><p class="eyebrow">Your workflow</p><h2>Shortcuts</h2><p>Saved searches for the people you look up most.</p></div><button class="primary-button" data-action="add-shortcut"><span class="button-symbol">＋</span> New shortcut</button></div><div class="shortcut-grid">${data.shortcuts.map((shortcut, index) => `<button class="shortcut-card" data-shortcut="${escapeHtml(shortcut.id)}"><span class="shortcut-mark">${["◷", "✳", "⌖"][index % 3]}</span><strong>${escapeHtml(shortcut.label)}</strong><small>${escapeHtml(shortcut.query || "Open saved search")}</small></button>`).join("")}${!data.shortcuts.length ? "<div class=\"empty-state\">Create a shortcut from a search you use often.</div>" : ""}</div>`;
    }
    function renderMeetings() {
      const meetings = companyMeetings().slice().sort((a, b) => a.date.localeCompare(b.date));
      return `<div class="section-heading"><div><p class="eyebrow">Make time for people</p><h2>Meetings</h2><p>Planned conversations with your teammates.</p></div><button class="primary-button" data-action="add-meeting"><span class="button-symbol">＋</span> Schedule meeting</button></div>${meetings.length ? `<div class="meeting-list">${meetings.map(meeting => { const date = new Date(meeting.date); const person = data.people.find(item => item.id === meeting.personId); return `<article class="meeting-row"><div class="meeting-date"><strong>${date.toLocaleDateString(undefined, { day: "2-digit", timeZone: "UTC" })}</strong><small>${date.toLocaleDateString(undefined, { month: "short", timeZone: "UTC" })}</small></div><div class="meeting-info"><strong>${escapeHtml(meeting.title)}</strong><small>${date.toLocaleString(undefined, { weekday: "short", hour: "numeric", minute: "2-digit" })} · ${escapeHtml(meeting.duration)} min${person ? ` · with ${escapeHtml(person.name)}` : ""}</small></div><button class="icon-button" data-action="delete-meeting" data-meeting="${escapeHtml(meeting.id)}" title="Cancel meeting" aria-label="Cancel meeting">×</button></article>`; }).join("")}</div>` : `<div class="people-list"><div class="empty-state"><strong>Your calendar is clear</strong>Schedule a meeting to make time with a teammate.</div></div>`}`;
    }
    function renderCompany(company, peopleCount, bookmarkedCount) {
      return `<div class="section-heading"><div><p class="eyebrow">Workspace settings</p><h2>Your company</h2><p>Manage the people and invitations for this directory.</p></div><button class="primary-button" data-action="new-company"><span class="button-symbol">＋</span> New company</button></div><section class="company-banner"><div><h2>${escapeHtml(company.name)}</h2><p>${escapeHtml(company.industry || "Company")} · ${escapeHtml(company.location || "Location not set")}</p></div><button class="quiet-button" data-action="invite"><span class="button-symbol">↗</span> Invite people</button></section><div class="company-detail-grid"><section class="detail-panel"><h3>Workspace at a glance</h3><p>${peopleCount} people · ${new Set(companyPeople().map(person => person.department).filter(Boolean)).size} departments · ${bookmarkedCount} bookmarked profiles</p></section><section class="detail-panel"><h3>Team referral link</h3><p>Anyone with this link can submit their details to join this company in this local demo. It is not a secure sign-in link.</p><button class="text-button" data-action="invite">Copy referral link →</button></section></div>`;
    }
    function bindEvents() {
      document.querySelectorAll("[data-view]").forEach(button => button.addEventListener("click", () => setView(button.dataset.view)));
      document.querySelectorAll("[data-action]").forEach(button => button.addEventListener("click", () => runAction(button.dataset.action, button.dataset)));
      document.querySelectorAll("[data-company]").forEach(button => button.addEventListener("click", () => {
        data.activeCompany = button.dataset.company; saveData(); currentView = "search"; currentQuery = ""; document.getElementById("company-menu")?.classList.remove("open"); render();
      }));
      document.getElementById("company-picker")?.addEventListener("click", () => {
        const menu = document.getElementById("company-menu"); menu.classList.toggle("open"); document.getElementById("company-picker").setAttribute("aria-expanded", menu.classList.contains("open"));
      });
      document.getElementById("directory-search")?.addEventListener("input", event => { currentQuery = event.target.value; const cursor = event.target.selectionStart; render(); const input = document.getElementById("directory-search"); input.focus(); input.setSelectionRange(cursor, cursor); });
      document.getElementById("department-filter")?.addEventListener("change", event => { activeDepartment = event.target.value; render(); });
      document.querySelectorAll("[data-shortcut]").forEach(button => button.addEventListener("click", () => {
        const shortcut = data.shortcuts.find(item => item.id === button.dataset.shortcut); if (!shortcut) return;
        currentView = "search"; currentQuery = shortcut.query; activeDepartment = "all"; render();
      }));
    }
    function runAction(action, details) {
      if (action === "new-company") openCompanyModal();
      if (action === "add-person") openPersonModal();
      if (action === "add-shortcut") openShortcutModal();
      if (action === "add-meeting") openMeetingModal();
      if (action === "invite") openInviteModal();
      if (action === "bookmark") toggleBookmark(details.person);
      if (action === "delete-meeting") deleteMeeting(details.meeting);
    }
    function toggleBookmark(personId) {
      data.bookmarks = data.bookmarks.includes(personId) ? data.bookmarks.filter(id => id !== personId) : [...data.bookmarks, personId]; saveData(); render();
      showToast(data.bookmarks.includes(personId) ? "Person added to bookmarks." : "Person removed from bookmarks.");
    }
    function openModal(title, copy, body, onSubmit) {
      const root = document.getElementById("modal-root");
      root.innerHTML = `<div class="modal-backdrop" data-close-modal><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><h2 id="modal-title">${title}</h2><p class="modal-copy">${copy}</p>${body}</section></div>`;
      root.querySelector("[data-close-modal]").addEventListener("click", event => { if (event.target === event.currentTarget) closeModal(); });
      root.querySelector("form")?.addEventListener("submit", event => { event.preventDefault(); onSubmit(new FormData(event.currentTarget)); });
      root.querySelector("[data-cancel]")?.addEventListener("click", closeModal);
      root.querySelector("input, select")?.focus();
    }
    function closeModal() { document.getElementById("modal-root").innerHTML = ""; }
    function modalActions() { return `<div class="modal-actions"><button class="quiet-button" type="button" data-cancel>Cancel</button><button class="primary-button" type="submit">Create</button></div>`; }
    function openCompanyModal() {
      openModal("Create a company", "Set up a separate team directory. You can invite people as soon as it's created.", `<form><div class="form-grid"><div class="field full"><label for="company-name">Company name</label><input id="company-name" name="name" required maxlength="70" placeholder="e.g. Northstar Health"></div><div class="field"><label for="company-industry">Industry</label><input id="company-industry" name="industry" maxlength="50" placeholder="Healthcare"></div><div class="field"><label for="company-location">Location</label><input id="company-location" name="location" maxlength="70" placeholder="City, country"></div></div>${modalActions()}</form>`, form => {
        const name = String(form.get("name")).trim();
        if (data.companies.some(company => company.name.toLowerCase() === name.toLowerCase())) { showToast("A company with that name already exists.", true); return; }
        const id = `company-${crypto.randomUUID()}`;
        data.companies.push({ id, name, industry: String(form.get("industry")).trim(), location: String(form.get("location")).trim(), inviteCode: `join-${crypto.randomUUID()}` }); data.activeCompany = id; saveData(); closeModal(); setView("company"); showToast(`${name} is ready. Invite your first teammate.`);
      });
    }
    function openPersonModal(prefill = {}) {
      const company = activeCompany();
      openModal("Add a teammate", `Create a profile in ${escapeHtml(company.name)}'s directory.`, `<form><div class="form-grid"><div class="field"><label for="person-name">Full name</label><input id="person-name" name="name" required maxlength="70" placeholder="Jordan Lee" value="${escapeHtml(prefill.name || "")}"></div><div class="field"><label for="person-role">Role</label><input id="person-role" name="role" required maxlength="70" placeholder="Product manager"></div><div class="field"><label for="person-email">Work email</label><input id="person-email" name="email" type="email" required maxlength="120" placeholder="jordan@company.com" value="${escapeHtml(prefill.email || "")}"></div><div class="field"><label for="person-department">Department</label><input id="person-department" name="department" maxlength="60" placeholder="Product"></div><div class="field"><label for="person-location">Location</label><input id="person-location" name="location" maxlength="70" placeholder="Washington, DC"></div><div class="field"><label for="person-status">Status</label><select id="person-status" name="status"><option>Available</option><option>In a meeting</option><option>Away</option></select></div></div>${modalActions()}</form>`, form => {
        const email = String(form.get("email")).trim().toLowerCase();
        if (data.people.some(person => person.companyId === company.id && person.email.toLowerCase() === email)) { showToast("That email is already in this directory.", true); return; }
        data.people.push({ id: `person-${crypto.randomUUID()}`, companyId: company.id, name: String(form.get("name")).trim(), role: String(form.get("role")).trim(), email, department: String(form.get("department")).trim(), location: String(form.get("location")).trim(), status: String(form.get("status")) }); saveData(); closeModal(); currentView = "search"; currentQuery = ""; render(); showToast("Teammate added to the directory.");
      });
    }
    function openShortcutModal() {
      openModal("Save a search", "Give a frequently used people search a name you will recognize.", `<form><div class="field"><label for="shortcut-name">Shortcut name</label><input id="shortcut-name" name="label" required maxlength="45" placeholder="Design team"></div><div class="field"><label for="shortcut-query">Search terms</label><input id="shortcut-query" name="query" required maxlength="100" placeholder="designer or Product & Design" value="${escapeHtml(currentQuery)}"></div>${modalActions()}</form>`, form => {
        data.shortcuts.push({ id: `shortcut-${crypto.randomUUID()}`, label: String(form.get("label")).trim(), query: String(form.get("query")).trim() }); saveData(); closeModal(); render(); showToast("Shortcut saved.");
      });
    }
    function openMeetingModal(personId = "") {
      const people = companyPeople();
      if (!people.length) { showToast("Add a teammate before scheduling a meeting.", true); return; }
      const options = people.map(person => `<option value="${escapeHtml(person.id)}"${person.id === personId ? " selected" : ""}>${escapeHtml(person.name)} · ${escapeHtml(person.role)}</option>`).join("");
      const defaultDate = new Date(Date.now() + 86400000); defaultDate.setMinutes(0, 0, 0); defaultDate.setHours(10);
      const dateValue = `${defaultDate.getFullYear()}-${String(defaultDate.getMonth() + 1).padStart(2, "0")}-${String(defaultDate.getDate()).padStart(2, "0")}T${String(defaultDate.getHours()).padStart(2, "0")}:00`;
      openModal("Schedule a meeting", "Add a conversation to this company's shared meeting list.", `<form><div class="field"><label for="meeting-title">Meeting title</label><input id="meeting-title" name="title" required maxlength="90" placeholder="Project check-in"></div><div class="field"><label for="meeting-person">Meet with</label><select id="meeting-person" name="personId" required>${options}</select></div><div class="form-grid"><div class="field"><label for="meeting-date">Date and time</label><input id="meeting-date" name="date" type="datetime-local" required value="${dateValue}"></div><div class="field"><label for="meeting-duration">Duration</label><select id="meeting-duration" name="duration"><option value="15">15 minutes</option><option value="30" selected>30 minutes</option><option value="45">45 minutes</option><option value="60">1 hour</option></select></div></div>${modalActions()}</form>`, form => {
        data.meetings.push({ id: `meeting-${crypto.randomUUID()}`, companyId: activeCompany().id, title: String(form.get("title")).trim(), personId: String(form.get("personId")), date: String(form.get("date")), duration: String(form.get("duration")) }); saveData(); closeModal(); setView("meetings"); showToast("Meeting scheduled.");
      });
    }
    function openInviteModal() {
      const company = activeCompany();
      const url = new URL(location.href); url.searchParams.set("join", company.inviteCode); url.hash = "";
      openModal("Invite your team", `Share a referral link to add people to ${escapeHtml(company.name)}.`, `<div class="link-box" id="referral-link">${escapeHtml(url.href)}</div><div class="notice">This prototype stores profiles in this browser only. Referral links do not authenticate users or share data across devices.</div><div class="modal-actions"><button class="quiet-button" type="button" data-cancel>Close</button><button class="primary-button" type="button" id="copy-invite"><span class="button-symbol">⧉</span> Copy link</button></div>`, () => {});
      document.getElementById("copy-invite").addEventListener("click", async () => {
        try { await navigator.clipboard.writeText(url.href); showToast("Referral link copied."); }
        catch { showToast("Clipboard access was blocked. Select and copy the link above.", true); }
      });
    }
    function openJoinModal(company) {
      openModal(`Join ${escapeHtml(company.name)}`, "Enter your details to create a directory profile. This demo does not verify identity.", `<form><div class="notice">This is a local prototype, not a secure account sign-in. Your profile will only appear in this browser.</div><div class="field"><label for="join-name">Full name</label><input id="join-name" name="name" required maxlength="70" placeholder="Your name"></div><div class="field"><label for="join-email">Work email</label><input id="join-email" name="email" type="email" required maxlength="120" placeholder="you@company.com"></div><div class="field"><label for="join-role">Role</label><input id="join-role" name="role" required maxlength="70" placeholder="Your role"></div><div class="modal-actions"><button class="quiet-button" type="button" data-cancel>Not now</button><button class="primary-button" type="submit">Join company</button></div></form>`, form => {
        const email = String(form.get("email")).trim().toLowerCase();
        if (data.people.some(person => person.companyId === company.id && person.email.toLowerCase() === email)) { showToast("That email already has a profile in this company.", true); return; }
        data.people.push({ id: `person-${crypto.randomUUID()}`, companyId: company.id, name: String(form.get("name")).trim(), role: String(form.get("role")).trim(), email, department: "", location: "", status: "Available" }); data.activeCompany = company.id; saveData(); closeModal(); history.replaceState({}, "", location.pathname); setView("search"); showToast(`Welcome to ${company.name}'s directory.`);
      });
    }
    function deleteMeeting(meetingId) {
      data.meetings = data.meetings.filter(meeting => meeting.id !== meetingId); saveData(); render(); showToast("Meeting removed from the schedule.");
    }
    document.addEventListener("keydown", event => {
      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") { event.preventDefault(); document.getElementById("directory-search")?.focus(); }
      if (event.key === "Escape") { closeModal(); document.getElementById("company-menu")?.classList.remove("open"); }
    });
    render();
  </script>
</body>
</html>
